name: cyberskin_app
description: "CyberSkin App 端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  cyberskin_device_sdk:
    path: ../cyberskin-device-sdk
  # 强大的官方 Image 扩展组件, 支持加载以及失败显示，缓存网络图片，缩放拖拽图片，图片浏览(微信掘金效果)，
  # 滑动退出页面(微信掘金效果)，编辑图片(裁剪旋转翻转)，保存，绘制自定义效果等功能
  # https://github.com/fluttercandies/extended_image/blob/master/README-ZH.md
  extended_image: ^10.1.0
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_inappwebview: ^6.1.5
  flutter_liquid_glass_plus: ^0.0.7
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_video_feed_list:
    path: /Users/cxl/GithubRepos/flutter_video_feed_list
  flutter_widget_from_html: ^0.17.4
  get: ^4.7.3
  http: ^1.6.0
  image_picker: ^1.2.2
  logger: ^2.8.0
  lottie: ^3.6.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dependency_overrides:
  flutter_secure_storage_windows: 4.1.0
  win32: 5.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/control/
    - assets/images/home/
    - assets/images/device/
    - assets/images/device_modules/
    - assets/images/device_modules/heat/
    - assets/images/device_modules/suck/
    - assets/images/device_modules/thrust/
    - assets/images/device_modules/vibration/
    - assets/lotties/
